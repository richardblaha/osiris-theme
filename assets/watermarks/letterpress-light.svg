<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OSIRIS watermark">
  <title>OSIRIS — letterpress watermark (light)</title>
  <!--
    Debossed OSIRIS mark for empty-editor / workbench backgrounds on the light
    ramp (white / #f6f8fa). Pressed edges: soft shadow above, white highlight
    below. Rasterised 1x/2x by scripts/build.sh
    (assets/watermarks/letterpress-light{,@2x}.png).
  -->
  <defs>
    <filter id="lp" x="-25%" y="-25%" width="150%" height="150%">
      <feOffset in="SourceAlpha" dx="0" dy="-2" result="a"/>
      <feFlood flood-color="#8b949e" flood-opacity="0.45"/>
      <feComposite in2="a" operator="in" result="bevel"/>
      <feOffset in="SourceAlpha" dx="0" dy="2.5" result="b"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="bevel"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#lp)" transform="translate(106 106) scale(1.5)">
    <polygon points="100,30 20,130 100,170" fill="#eaeef2" fill-opacity="0.85"/>
    <polygon points="100,30 180,130 100,170" fill="#e2e7ec" fill-opacity="0.85"/>
    <polygon points="20,130 100,170 180,130 100,110" fill="#8b949e" fill-opacity="0.18"/>
    <line x1="100" y1="30" x2="100" y2="170" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
  </g>
</svg>
