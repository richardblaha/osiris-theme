<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#101722"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="moon" cx="78%" cy="22%" r="20%">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#ff2a85"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#moon)"/>
  <circle cx="3000" cy="470" r="120" fill="#0d1117" stroke="#00f2fe" stroke-width="4"/>

  <!-- hieroglyph strip -->
  <g stroke="#00f2fe" stroke-width="4" fill="none" opacity="0.35">
    <rect x="180" y="240" width="120" height="1680"/>
    <g transform="translate(240 320)" stroke-linecap="round">
      <circle cx="0" cy="0" r="26"/>
      <path d="M-30 120 h60 M0 90 v60"/>
      <path d="M-34 260 q34 -50 68 0 q-34 50 -68 0z"/>
      <path d="M-30 420 l30 -46 l30 46 z"/>
      <path d="M-34 560 h68 M-20 540 v40 M20 540 v40"/>
      <path d="M0 700 q-40 40 0 80 q40 -40 0 -80z"/>
      <path d="M-30 860 h60 v40 h-60z"/>
      <path d="M-34 1010 q34 60 68 0"/>
    </g>
  </g>

  <!-- pyramids silhouette -->
  <g fill="#0b0f15">
    <polygon points="600,1720 1180,1000 1760,1720"/>
    <polygon points="1500,1720 1900,1180 2300,1720"/>
    <polygon points="2050,1720 2680,900 3310,1720"/>
  </g>
  <g fill="none" stroke="url(#rim)" stroke-width="5" opacity="0.8">
    <path d="M1180,1000 L1760,1720"/>
    <path d="M2680,900 L3310,1720"/>
  </g>

  <!-- Djed pillar (centre) -->
  <g transform="translate(1920 1180)" stroke="#ff2a85" stroke-width="10" fill="none" opacity="0.92">
    <line x1="0" y1="-360" x2="0" y2="300"/>
    <line x1="-90" y1="-330" x2="90" y2="-330"/>
    <line x1="-100" y1="-270" x2="100" y2="-270"/>
    <line x1="-110" y1="-210" x2="110" y2="-210"/>
    <line x1="-120" y1="-150" x2="120" y2="-150"/>
    <path d="M-70 300 h140" />
  </g>

  <!-- scarab -->
  <g transform="translate(1920 640)" fill="#00f2fe" opacity="0.9">
    <ellipse cx="0" cy="0" rx="70" ry="90"/>
    <path d="M0 -95 q-55 -45 -95 -10 q40 10 55 45z" />
    <path d="M0 -95 q55 -45 95 -10 q-40 10 -55 45z" />
    <path d="M-70 -20 q-70 10 -95 70 M70 -20 q70 10 95 70 M-60 60 q-55 40 -70 100 M60 60 q55 40 70 100" stroke="#00f2fe" stroke-width="8" fill="none"/>
  </g>

  <rect x="0" y="1720" width="3840" height="440" fill="#090c11"/>
  <text x="1920" y="2010" text-anchor="middle" fill="#e6edf3" font-family="Fira Code, monospace" font-size="44" letter-spacing="22" opacity="0.8">OSIRIS</text>
</svg>
