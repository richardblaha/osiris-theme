name: Release

# Push a tag `vX.Y.Z` (matching the VERSION file) → this builds every artifact,
# publishes a GitHub Release with them attached and pushes the npm packages.
# `vX.Y.Z-rc.1` etc. → pre-release + npm dist-tag `next`.
#
# Stable tags also publish the .deb set to the APT repo in
# richardblaha/osiris-deb-repo (job `apt`).
#
# GitHub Pages (the design-system preview) is NOT deployed here — build.yml owns it, from the `main` push you make just
# before tagging. That keeps the live site in lock-step with `main` and stops an
# old-tag re-run from clobbering it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          want="$(cat VERSION)"
          case "$tag" in
            "$want"|"$want"-*)
              echo "tag $GITHUB_REF_NAME matches VERSION ($want)" ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want) — bump VERSION or retag"
              exit 1 ;;
          esac

  build:
    needs: verify
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.vsix' -o -name '*.tgz' -o -name '*.tar.gz' -o -name '*.zip' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} dist/ \;
          echo "---- release assets ----"
          ls -la dist/
          # sanity: the four package kinds the release is defined by must be present
          for kind in vsix deb rpm tgz; do
            ls dist/*."$kind" >/dev/null 2>&1 || { echo "::error::no .$kind produced"; exit 1; }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OSIRIS Themes ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **OSIRIS Themes ${{ github.ref_name }}** — one design system, every surface. See `CHANGELOG.md`.

            ### VS Code
            `osiris-theme-*.vsix` — *Osiris Dark* / *Osiris Light* colour themes,
            *Osiris File Icons* and *Osiris Product Icons*.

            ### Web
            - npm: `osiris-vitepress-theme`, `osiris-bootstrap-theme` — attached as
              `.tgz` and published to <https://www.npmjs.com/>.
            - Browsers: `osiris-{chromium,firefox}-{dark,light}-*.zip` — Manifest V3
              (Chromium/Chrome/Edge) and V2 (Firefox) themes.
            - Forgejo / Gitea: `osiris-forgejo-*.zip` — `osiris-{dark,light,auto}`
              CSS themes for `custom/public/assets/css/`.

            ### Linux desktop
            - Debian/Ubuntu `.deb`: `osiris-theme-gtk`, `osiris-theme-plasma`,
              `osiris-icon-theme`, `osiris-theme-grub`, `osiris-wallpapers`, and the
              `osiris-desktop-theme` metapackage. Also in the signed APT repo —
              install `osiris-archive-keyring` (or
              `curl -fsSL https://richardblaha.github.io/osiris-deb-repo/setup.sh | sudo sh`)
              then `apt install osiris-desktop-theme` (see `docs/APT.md`).
            - Fedora/RHEL `.rpm`: the matching noarch set.
            - Other distros: `osiris-gnome-theme-*.tar.gz` — GTK 3/4 + GNOME Shell
              + Metacity (dark + light) plus the GtkSourceView schemes, with an
              install README.

            Live preview / design system → https://richardblaha.github.io/osiris-theme/

  apt:
    # Add this release's .deb files to the APT repo (richardblaha/osiris-deb-repo,
    # served by its GitHub Pages). Older versions stay in the pool. Stable only.
    needs: [build, release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: debs
      - uses: actions/checkout@v4
        with:
          repository: richardblaha/osiris-deb-repo
          ssh-key: ${{ secrets.DEB_REPO_DEPLOY_KEY }}
          path: deb-repo
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev rsync
      - name: Import APT signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          [ -n "${KEY:-}" ] || { echo "::error::APT_GPG_PRIVATE_KEY not set"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          echo "APT_GPG_KEY=$fpr" >> "$GITHUB_ENV"
      - name: Rebuild the repo (existing pool + this release)
        run: |
          set -euo pipefail
          mkdir all
          [ ! -d deb-repo/pool ] || find deb-repo/pool -name '*.deb' -exec cp -t all {} +
          cp debs/*.deb all/
          packaging/apt/build-apt-repo.sh build/apt all
          rsync -a --delete --exclude .git --exclude README.md build/apt/ deb-repo/
          touch deb-repo/.nojekyll
      - name: Push
        working-directory: deb-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "osiris $GITHUB_REF_NAME"
          git push

  publish-npm:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret not set — skipping npm publish (tarballs are still on the Release)"
            exit 0
          fi
          dist_tag=latest
          case "$GITHUB_REF_NAME" in *-*) dist_tag=next ;; esac
          for tgz in dist/*.tgz; do
            echo "publishing $tgz (@$dist_tag)"
            npm publish "$tgz" --provenance --access public --tag "$dist_tag"
          done
